name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Reset, test, type-check schema and run advisors
        run: npm run db:check

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # A new network namespace has no interface at all, so this also catches
      # anything that gets around the guard inside the test process.
      - name: Unit and component tests without a network
        run: >-
          sudo unshare --net -- sudo --user "$USER" env "PATH=$PATH" "CI=true"
          npm test

      - name: Prove a failing test returns non-zero and leaves evidence
        run: npm run test:failure-proof

      - name: Production build without production env
        run: npm run build

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Clean install
        run: npm ci

      # Chrome comes with the runner image. No browser is downloaded.
      - name: Prove a failing browser test leaves a trace and a screenshot
        run: npm run test:failure-proof -- --e2e

      - name: Start local Supabase
        run: npm run db:start

      - name: Build both servers and run the browser tests
        run: npm run test:e2e

      # Only synthetic seed data reaches these files.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
